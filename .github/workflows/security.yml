name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # every Monday at 06:00 UTC

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv pip install --system pip-audit .
      - name: Audit dependencies
        run: pip-audit
